---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: timothyw-dev-https-ingress
spec:
  entryPoints:
    {{- if .Values.ingress.tls }}
    - websecure
    {{- else }}
    - web
    {{- end }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`)
      priority: 10
      services:
        - name: app-service
          port: 80
  {{- if .Values.ingress.tls }}
  tls:
    secretName: timothyw-dev-tls
  {{- end }}
{{- if .Values.ingress.tls }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: timothyw-dev-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: timothyw-dev-http-ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`) && !PathPrefix(`/.well-known/acme-challenge/`)
      middlewares:
        - name: timothyw-dev-https-redirect
      services:
        - name: app-service
          port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: timothyw-dev-tls
spec:
  secretName: timothyw-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.ingress.host }}
{{- end }}
